<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports · EPMS Portal</title>
    <link rel="icon" type="image/png" href="/assets/epms/images/favicon.png">
    <link rel="stylesheet" href="/assets/epms/css/epms_portal.css">
</head>
<body class="portal-body">
<div class="portal-shell">
    {% include "templates/epms_sidebar.html" %}

    <main class="portal-main">
        <div class="page-wrap">

            <header class="page-head">
                <div>
                    <h1 class="page-title">Reports</h1>
                    <p class="page-subtitle">Every report opens right here in the portal — no ERP desk needed.</p>
                </div>
            </header>

            {% if reports %}
            <section class="report-grid">
                {% for r in reports %}
                <a class="report-tile" href="{{ r.url }}">
                    <span class="tile-icon {{ r.icon_class }}">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 118 2.83M22 12A10 10 0 0012 2v10z"/></svg>
                    </span>
                    <strong>{{ r.name }}</strong>
                    <span class="report-desc">{{ r.description }}</span>
                    <span class="report-open">
                        View report
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </span>
                </a>
                {% endfor %}
            </section>
            {% else %}
            <div class="card">
                <div class="empty">
                    <div class="empty-icon icon-amber">
                        <svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 118 2.83M22 12A10 10 0 0012 2v10z"/></svg>
                    </div>
                    <p>No reports configured yet.</p>
                </div>
            </div>
            {% endif %}

        </div>
    </main>
</div>
</body>
</html>
