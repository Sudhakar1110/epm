<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPMS Portal — Reports</title>
    <link rel="stylesheet" href="/assets/epms/css/epms_portal.css">
</head>
<body>
<div class="layout">
    {% include "epms_sidebar.html" %}
    <main class="main-content">
        <div class="page-header"><h1>Reports</h1><p>Access all performance reports and analytics.</p></div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
            {% for report in reports %}
            <a href="/app/query-report/{{ report.name }}" class="report-card" target="_blank">
                <div class="report-card-icon {{ report.icon_class }}">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 118 2.83M22 12A10 10 0 0012 2v10z"/></svg>
                </div>
                <h4>{{ report.name }}</h4>
                <p>{{ report.description }}</p>
            </a>
            {% endfor %}
        </div>
    </main>
</div>
<script>document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();document.querySelector('.search-box input').focus()}});</script>
</body>
</html>
