{% extends "templates/pages/epms/layout.html" %}
{% set active_page = "teams" %}

{% block content %}
<div class="epms-page-header"><h1>Teams</h1><p>All teams across the organization.</p></div>
<div class="epms-card epms-card-full"><div id="teams-box"><div class="empty"><p>Loading...</p></div></div></div>
{% endblock %}

{% block scripts %}
<script>
epms_call('epms.employee_performance.api.get_portal_teams', {}, function(r) {
    if(r&&r.length) { var h='<table class="epms-table"><thead><tr><th>Team</th><th>Leader</th><th>Members</th><th>Status</th></tr></thead><tbody>'; r.forEach(function(t){ h+='<tr><td><strong>'+t.team_name+'</strong></td><td>'+(t.team_leader||'-')+'</td><td>'+(t.total_members||0)+'</td><td><span class="badge badge-success">'+t.status+'</span></td></tr>'; }); h+='</tbody></table>'; document.getElementById('teams-box').innerHTML=h; }
    else document.getElementById('teams-box').innerHTML='<div class="empty"><p>No teams found</p></div>';
});
</script>
{% endblock %}
