{% extends "templates/pages/epms/layout.html" %}
{% set active_page = "scorecards" %}

{% block content %}
<div class="epms-page-header">
    <h1>Scorecards</h1>
    <p>Monthly performance scorecards for all employees.</p>
</div>

<div class="epms-card epms-card-full">
    <div id="scorecards-list"><div class="epms-empty"><p>Loading...</p></div></div>
</div>

<script>
frappe.ready(function() {
    frappe.call({ method: 'epms.employee_performance.api.get_portal_scorecards', callback: function(r) {
        if (r.message && r.message.length) {
            let html='<table class="epms-table"><thead><tr><th>Employee</th><th>Team</th><th>Score</th><th>Grade</th><th>Status</th></tr></thead><tbody>';
            r.message.forEach(function(s){
                let sc=s.overall_score>=80?'success':s.overall_score>=60?'warning':'danger';
                html+='<tr><td><strong>'+s.employee_name+'</strong></td><td>'+(s.team||'-')+'</td><td><span class="epms-badge epms-badge-'+sc+'">'+(s.overall_score||0).toFixed(1)+'</span></td><td>'+(s.final_grade||'-')+'</td><td><span class="epms-badge epms-badge-info">'+(s.performance_status||'-')+'</span></td></tr>';
            });
            html+='</tbody></table>';
            document.getElementById('scorecards-list').innerHTML=html;
        } else {
            document.getElementById('scorecards-list').innerHTML='<div class="epms-empty"><i class="octicon octicon-trophy"></i><p>No scorecards yet</p></div>';
        }
    }});
});
</script>
{% endblock %}
