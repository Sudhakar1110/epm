{% extends "templates/pages/epms/layout.html" %}
{% set active_page = "scorecards" %}

{% block content %}
<div class="epms-page-header"><h1>Scorecards</h1><p>Monthly performance scorecards.</p></div>
<div class="epms-card epms-card-full"><div id="sc-box"><div class="empty"><p>Loading...</p></div></div></div>
{% endblock %}

{% block scripts %}
<script>
epms_call('epms.employee_performance.api.get_portal_scorecards', {}, function(r) {
    if(r&&r.length) { var h='<table class="epms-table"><thead><tr><th>Employee</th><th>Team</th><th>Score</th><th>Grade</th><th>Status</th></tr></thead><tbody>'; r.forEach(function(s){ var sc=s.overall_score>=80?'success':s.overall_score>=60?'warning':'danger'; h+='<tr><td><strong>'+s.employee_name+'</strong></td><td>'+(s.team||'-')+'</td><td><span class="badge badge-'+sc+'">'+(s.overall_score||0).toFixed(1)+'</span></td><td>'+(s.final_grade||'-')+'</td><td><span class="badge badge-info">'+(s.performance_status||'-')+'</span></td></tr>'; }); h+='</tbody></table>'; document.getElementById('sc-box').innerHTML=h; }
    else document.getElementById('sc-box').innerHTML='<div class="empty"><p>No scorecards yet</p></div>';
});
</script>
{% endblock %}
