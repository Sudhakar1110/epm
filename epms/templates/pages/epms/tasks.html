{% extends "templates/pages/epms/layout.html" %}
{% set active_page = "tasks" %}

{% block content %}
<div class="epms-page-header" style="display:flex;justify-content:space-between;align-items:center;">
    <div><h1>Tasks</h1><p>All pending and in-progress tasks.</p></div>
    <a href="/app/pending-task/new" class="btn btn-primary" target="_blank">+ New Task</a>
</div>
<div class="filter-tabs">
    <button class="filter-tab active" onclick="ft('all',this)">All</button>
    <button class="filter-tab" onclick="ft('Pending',this)">Pending</button>
    <button class="filter-tab" onclick="ft('In Progress',this)">In Progress</button>
    <button class="filter-tab" onclick="ft('Completed',this)">Completed</button>
    <button class="filter-tab" onclick="ft('Blocked',this)">Blocked</button>
</div>
<div class="epms-card epms-card-full"><div id="tasks-box"><div class="empty"><p>Loading...</p></div></div></div>
{% endblock %}

{% block scripts %}
<script>
var AT=[];
epms_call('epms.employee_performance.api.get_portal_tasks', {}, function(r){ AT=r||[]; rt(AT); });
function ft(s,el){ document.querySelectorAll('.filter-tab').forEach(function(t){t.classList.remove('active')}); el.classList.add('active'); rt(s==='all'?AT:AT.filter(function(t){return t.current_status===s})); }
function rt(t){ if(!t.length){document.getElementById('tasks-box').innerHTML='<div class="empty"><p>No tasks</p></div>';return;} var h='<table class="epms-table"><thead><tr><th>Task</th><th>Employee</th><th>Due</th><th>Priority</th><th>Status</th></tr></thead><tbody>'; t.forEach(function(x){ var sc=x.current_status==='Completed'?'success':x.current_status==='Blocked'?'danger':'warning'; var pc=x.priority==='Critical'?'danger':x.priority==='High'?'warning':'info'; h+='<tr><td><strong>'+x.task+'</strong></td><td>'+x.employee_name+'</td><td>'+(x.expected_completion||'-')+'</td><td><span class="badge badge-'+pc+'">'+x.priority+'</span></td><td><span class="badge badge-'+sc+'">'+x.current_status+'</span></td></tr>'; }); h+='</tbody></table>'; document.getElementById('tasks-box').innerHTML=h; }
</script>
{% endblock %}
