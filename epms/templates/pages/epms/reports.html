{% extends "epms/layout.html" %}
{% set active_page = 'reports' %}

{% block content %}
<div class="page-header">
    <h1>Reports</h1>
    <p>Access all performance reports and analytics.</p>
</div>

<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">
    {% for report in reports %}
    <a href="/app/query-report/{{ report.name }}" class="report-card" target="_blank">
        <div class="report-card-icon {{ report.icon_class }}">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 118 2.83M22 12A10 10 0 0012 2v10z"/></svg>
        </div>
        <h4>{{ report.name }}</h4>
        <p>{{ report.description }}</p>
    </a>
    {% endfor %}
</div>
{% endblock %}
