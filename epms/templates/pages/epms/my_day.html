{% extends "templates/pages/epms/layout.html" %}
{% set active_page = "my-day" %}

{% block content %}
<div class="epms-page-header" style="display:flex;justify-content:space-between;align-items:center;">
    <div><h1>My Day</h1><p>Everything assigned to you.</p></div>
    <a href="/app/daily-performance/new" class="btn btn-primary" target="_blank">+ New Entry</a>
</div>
<div class="epms-stats-grid">
    <div class="epms-stat-card"><div class="epms-stat-icon blue">📋</div><div><span class="epms-stat-label">Open Tasks</span><span class="epms-stat-value" id="s1">0</span></div></div>
    <div class="epms-stat-card"><div class="epms-stat-icon green">✅</div><div><span class="epms-stat-label">Completed</span><span class="epms-stat-value" id="s2">0</span></div></div>
    <div class="epms-stat-card"><div class="epms-stat-icon yellow">⚠️</div><div><span class="epms-stat-label">Overdue</span><span class="epms-stat-value" id="s3">0</span></div></div>
    <div class="epms-stat-card"><div class="epms-stat-icon purple">🕐</div><div><span class="epms-stat-label">Hours Today</span><span class="epms-stat-value" id="s4">0</span></div></div>
</div>
<div class="epms-card epms-card-full">
    <div class="epms-card-header"><h3>Assigned to me</h3></div>
    <div id="tasks-list"><div class="empty"><p>Loading...</p></div></div>
</div>
{% endblock %}

{% block scripts %}
<script>
epms_call('epms.employee_performance.api.get_portal_tasks', {}, function(r) {
    if(r&&r.length) { var h='',o=0,c=0,od=0; r.forEach(function(t){ if(t.current_status==='Completed')c++; else o++; if(t.current_status==='Blocked')od++; var sc=t.current_status==='Completed'?'success':t.current_status==='Blocked'?'danger':'warning'; var pc=t.priority==='Critical'?'danger':t.priority==='High'?'warning':'info'; h+='<div class="list-item"><div class="list-icon" style="background:#f3f4f6;">📋</div><div style="flex:1;"><div class="list-title">'+t.task+'</div><div class="list-sub">'+t.employee_name+' · Due '+(t.expected_completion||'-')+' <span class="badge badge-'+pc+'" style="margin-left:8px;">'+t.priority+'</span></div></div><span class="badge badge-'+sc+'">'+t.current_status+'</span></div>'; }); document.getElementById('tasks-list').innerHTML=h; document.getElementById('s1').textContent=o; document.getElementById('s2').textContent=c; document.getElementById('s3').textContent=od; }
    else document.getElementById('tasks-list').innerHTML='<div class="empty"><p>No tasks</p></div>';
});
</script>
{% endblock %}
