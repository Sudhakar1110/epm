{% extends "templates/pages/epms/layout.html" %}
{% set active_page = "my-day" %}

{% block content %}
<div class="epms-page-header" style="display:flex;justify-content:space-between;align-items:center;">
    <div>
        <h1>My Day</h1>
        <p>Everything assigned to you, and what is waiting to be picked up.</p>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
        <input type="date" class="epms-btn epms-btn-outline" id="my-day-date" style="padding:8px 12px;">
        <a href="/app/daily-performance/new" class="epms-btn epms-btn-primary" target="_blank">
            <i class="octicon octicon-plus"></i> New Entry
        </a>
    </div>
</div>

<div class="epms-stats-grid">
    <div class="epms-stat-card">
        <div class="epms-stat-icon blue"><i class="octicon octicon-checklist"></i></div>
        <div class="epms-stat-info">
            <span class="epms-stat-label">Open Tasks</span>
            <span class="epms-stat-value" id="my-open-tasks">0</span>
        </div>
    </div>
    <div class="epms-stat-card">
        <div class="epms-stat-icon green"><i class="octicon octicon-check"></i></div>
        <div class="epms-stat-info">
            <span class="epms-stat-label">Completed</span>
            <span class="epms-stat-value" id="my-completed">0</span>
        </div>
    </div>
    <div class="epms-stat-card">
        <div class="epms-stat-icon yellow"><i class="octicon octicon-alert"></i></div>
        <div class="epms-stat-info">
            <span class="epms-stat-label">Overdue</span>
            <span class="epms-stat-value" id="my-overdue">0</span>
        </div>
    </div>
    <div class="epms-stat-card">
        <div class="epms-stat-icon purple"><i class="octicon octicon-clock"></i></div>
        <div class="epms-stat-info">
            <span class="epms-stat-label">Hours Today</span>
            <span class="epms-stat-value" id="my-hours">0</span>
        </div>
    </div>
</div>

<div class="epms-card epms-card-full">
    <div class="epms-card-header">
        <h3>Assigned to me</h3>
    </div>
    <div id="my-day-tasks">
        <div class="epms-empty"><p>Loading...</p></div>
    </div>
</div>

<script>
frappe.ready(function() {
    document.getElementById('my-day-date').value = frappe.datetime.get_today();
    frappe.call({ method: 'epms.employee_performance.api.get_portal_tasks', callback: function(r) {
        if (r.message && r.message.length) {
            let html = '';
            let open=0, completed=0, overdue=0;
            r.message.forEach(function(t) {
                if(t.current_status==='Completed') completed++; else open++;
                if(t.current_status==='Blocked') overdue++;
                let statusClass = t.current_status==='Completed'?'success':t.current_status==='Blocked'?'danger':'warning';
                let priClass = t.priority==='Critical'?'danger':t.priority==='High'?'warning':'info';
                html += '<div class="epms-list-item"><div class="epms-list-icon" style="background:#f3f4f6;"><i class="octicon octicon-check"></i></div><div class="epms-list-content"><div class="epms-list-title">'+t.task+'</div><div class="epms-list-sub">'+t.employee_name+' · Due '+(t.expected_completion||'-')+' <span class="epms-badge epms-badge-'+priClass+'" style="margin-left:8px;">'+t.priority+'</span></div></div><span class="epms-badge epms-badge-'+statusClass+'">'+t.current_status+'</span></div>';
            });
            document.getElementById('my-day-tasks').innerHTML = html;
            document.getElementById('my-open-tasks').textContent = open;
            document.getElementById('my-completed').textContent = completed;
            document.getElementById('my-overdue').textContent = overdue;
        } else {
            document.getElementById('my-day-tasks').innerHTML = '<div class="epms-empty"><i class="octicon octicon-check"></i><p>No tasks assigned</p></div>';
        }
    }});
});
</script>
{% endblock %}
