{% extends "templates/pages/epms/layout.html" %}
{% set active_page = "tasks" %}

{% block content %}
<div class="epms-page-header" style="display:flex;justify-content:space-between;align-items:center;">
    <div>
        <h1>Tasks</h1>
        <p>All pending and in-progress tasks.</p>
    </div>
    <a href="/app/pending-task/new" class="epms-btn epms-btn-primary" target="_blank"><i class="octicon octicon-plus"></i> New Task</a>
</div>

<div class="epms-filter-tabs">
    <button class="epms-filter-tab active" onclick="filterTasks('all',this)">All</button>
    <button class="epms-filter-tab" onclick="filterTasks('Pending',this)">Pending</button>
    <button class="epms-filter-tab" onclick="filterTasks('In Progress',this)">In Progress</button>
    <button class="epms-filter-tab" onclick="filterTasks('Completed',this)">Completed</button>
    <button class="epms-filter-tab" onclick="filterTasks('Blocked',this)">Blocked</button>
</div>

<div class="epms-card epms-card-full">
    <div id="tasks-list"><div class="epms-empty"><p>Loading...</p></div></div>
</div>

<script>
var allTasks = [];
frappe.ready(function() {
    frappe.call({ method: 'epms.employee_performance.api.get_portal_tasks', callback: function(r) {
        allTasks = r.message || [];
        renderTasks(allTasks);
    }});
});
function filterTasks(status, el) {
    document.querySelectorAll('.epms-filter-tab').forEach(function(t){t.classList.remove('active');});
    el.classList.add('active');
    renderTasks(status==='all'?allTasks:allTasks.filter(function(t){return t.current_status===status;}));
}
function renderTasks(tasks) {
    if (!tasks.length) { document.getElementById('tasks-list').innerHTML='<div class="epms-empty"><i class="octicon octicon-checklist"></i><p>No tasks found</p></div>'; return; }
    let html='<table class="epms-table"><thead><tr><th>Task</th><th>Employee</th><th>Due Date</th><th>Priority</th><th>Status</th></tr></thead><tbody>';
    tasks.forEach(function(t){
        let sc=t.current_status==='Completed'?'success':t.current_status==='Blocked'?'danger':'warning';
        let pc=t.priority==='Critical'?'danger':t.priority==='High'?'warning':'info';
        html+='<tr><td><strong>'+t.task+'</strong></td><td>'+t.employee_name+'</td><td>'+(t.expected_completion||'-')+'</td><td><span class="epms-badge epms-badge-'+pc+'">'+t.priority+'</span></td><td><span class="epms-badge epms-badge-'+sc+'">'+t.current_status+'</span></td></tr>';
    });
    html+='</tbody></table>';
    document.getElementById('tasks-list').innerHTML=html;
}
</script>
{% endblock %}
